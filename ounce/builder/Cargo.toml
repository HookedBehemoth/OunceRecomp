[package]
name = "ounce"
version = "0.1.0"
edition = "2021"
description = "ounce: builds, runs and tests the games; the player's builder (a dump -> a portable game folder)"
publish = false

[[bin]]
name = "ounce"
path = "src/main.rs"

[dependencies]
ounce-core = { path = "../core" }
ounce-lift = { path = "../lift" }
ounce-dump = { path = "../dump" }
ounce-tex = { path = "../tex" }
ounce-shaders = { path = "../shaders" }
png = "0.18"
regex = "1"
serde_json = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode"] }
sha1.workspace = true
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# (Windows: the zlib and zstd LLVM's libraries call, which the LLVM release's archive does not ship; build.rs)
[target.'cfg(windows)'.dependencies]
libz-sys = { version = "1", default-features = false, features = ["static"] }
zstd-sys = { version = "2", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[build-dependencies]
cc = "1"

[features]
# the development build: the system's LLVM and clang, dynamically
default = ["clang"]
# LLVM, lld (and clang) linked statically from LLVM_STATIC_DIR, a build tree of the same LLVM version
static-llvm = []
# clang's libraries too (the system's libclang-cpp, or static with static-llvm): `build` and `compile-c`, the host's C
# compiled in this process
clang = []
