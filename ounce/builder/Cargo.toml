[package]
name = "hookshot-builder"
version = "0.1.0"
edition = "2021"
description = "The player's builder: a dump (.nup, or exefs/ + romfs/) -> a portable game folder, in one process"
publish = false

[[bin]]
name = "hookshot-builder"
path = "src/main.rs"

[dependencies]
ounce-lift = { path = "../lift" }
sha1.workspace = true

[build-dependencies]
cc = "1"

[features]
# LLVM, lld (and clang) linked statically from LLVM_STATIC_DIR, a build tree of the same LLVM version
static-llvm = []
# clang's libraries too: `compile-c`, a host C file compiled in this process (needs static-llvm)
clang = ["static-llvm"]
