[package]
name = "hookshot-builder"
version = "0.1.0"
edition = "2021"
description = "The player's builder: a dump (.nup, or exefs/ + romfs/) -> a portable game folder, in one process"
publish = false

[[bin]]
name = "hookshot-builder"
path = "src/main.rs"

[dependencies]
ounce-lift = { path = "../lift" }
ounce-dump = { path = "../dump" }
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode"] }
sha1.workspace = true

[build-dependencies]
cc = "1"

[features]
# the development build: the system's LLVM and clang, dynamically
default = ["clang"]
# LLVM, lld (and clang) linked statically from LLVM_STATIC_DIR, a build tree of the same LLVM version
static-llvm = []
# clang's libraries too (the system's libclang-cpp, or static with static-llvm): `build` and `compile-c`, the host's C
# compiled in this process
clang = []
