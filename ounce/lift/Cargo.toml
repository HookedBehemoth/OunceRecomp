[package]
name = "ounce-lift"
version = "0.1.0"
edition = "2021"
description = "The lifter: AArch64 -> typed SSA IR -> LLVM IR"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "ounce-lift"
path = "src/main.rs"

[dependencies]
ounce-core = { path = "../core" }
ounce-decode = { path = "decode" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha2 = "0.11"
rayon = "1.10"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode"] }
sha1.workspace = true
cpp_demangle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[features]
# a global allocator that counts allocations and bytes (reported at the end of a run)
count-alloc = []
