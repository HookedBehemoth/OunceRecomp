# Facts of the platform (Horizon, the Nintendo SDK, its C and C++ runtime), not of one game: the Rust lifter reads them
# (ounce/lift).

# a function that calls one of these is a setjmp owner (discover)
setjmp_names = ["__setjmp", "setjmp", "_setjmp"]

# functions that do not return whatever their code says: seeds of the noreturn fixed point (summary), by symbol name
noreturn_names = ["abort", "__assert_fail", "_Exit", "exit", "__cxa_throw", "__cxa_rethrow", "_Unwind_RaiseException", "_Unwind_ForcedUnwind", "_Unwind_Resume", "png_error", "png_chunk_error", "png_fixed_error"]
noreturn_parts = ["AbortImpl", "UnexpectedDefaultImpl", "ExitProcess", "QuickExit", "terminateEv", "__throw_", "CriticalSectionAbort"]

# the SDK's OS-facing namespaces: an imported free function of one is stubbed (standalone.hle_set)
os_namespaces = ["account", "album", "aoc", "apm", "applet", "audio", "bcat", "camera", "capture", "chat", "codec", "detail", "diag", "ec", "err", "fatal", "friends", "gs", "hid", "irsensor", "lbl", "ldn", "movie", "news", "nfp", "nifm", "npns", "ns", "oe", "olsc", "pctl", "pl", "prepo", "ro", "settings", "socket", "ssl", "swkbd", "syncpt", "time", "vi", "web"]
