[package]
name = "hookshot-gui"
version = "0.1.0"
edition = "2021"
description = "The builder's window: runs hookshot-builder as a child and shows its progress lines"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "default_fonts"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
