[package]
name = "ounce-dump"
version = "0.1.0"
edition = "2021"
description = "A player's dump (.nup, or exefs/ + romfs/) read and written out as the folder the lift and the game read"
publish = false

[dependencies]
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[build-dependencies]
cc = "1"
