# OunceRecomp's Rust: the lifter (lift, its decoder lift/decode), the player's builder (builder) and its window (gui), one
# workspace with one Cargo.lock and one target/.
[workspace]
members = ["lift", "lift/decode", "builder", "dump", "tex", "gui"]
# (the window is built on its own: cargo build --profile gui -p ounce-gui)
default-members = ["lift", "lift/decode", "builder", "dump", "tex"]
resolver = "2"

[workspace.dependencies]
sha1 = "0.10"

[profile.release]
debug = 1
lto = "fat"
codegen-units = 1

# the window: no LTO, so its 120 crates take half a minute, not more than a minute
[profile.gui]
inherits = "release"
lto = false
codegen-units = 16
debug = 0
strip = true
