# The Legend of Zelda: Ocarina of Time (the Switch 2 build), as the lift and the build take it.
name = "oot"

# guest address -> our label: the builder names the executable's functions with it (a file beside this one)
labels = "labels.txt"

# the hot list and the link order (docs/lifter.md, "Game description files")
hot = "hot_funcs.bin"
hot_order = "hot_order.bin"

# the game's executable in its folder (a file name), the window's title, and its icon (a BMP beside this file): the
# builder puts the title and the icon into the game folder beside the executable
exe = "Ocarina of Time"
title = "The Legend of Zelda: Ocarina of Time"
icon = "icon.bmp"

# the game's patch files (C, beside this file): built with the runtime's (runtime/sources.txt) and read by the patch scan.
# Rows at one instruction run in this order (list_kinds.c's before eng_jobs.c's)
patches = [
    "patches/list_kinds.c", "patches/assets.c", "patches/depth_copy.c", "patches/diag_env.c",
    "patches/diag_nodata.c", "patches/job_sync.c", "patches/layer_ahead.c",
    "patches/mesh_args.c", "patches/mesh_binds.c", "patches/mesh_lists.c",
    "patches/mesh_system.c", "patches/movie.c", "patches/ndsr.c", "patches/passes.c", "patches/patch_log.c",
    "patches/rt_ids.c", "patches/sky_lut.c", "patches/tex_dedup.c", "patches/texdata.c",
    "patches/eng_jobs.c", "patches/mouse_native.c", "patches/nn_zstd.c", "patches/oot_probes.c", "patches/prompts.c",
    "patches/rt_slots.c", "patches/hooks.c",
    "patches/frame_sleep.c", "patches/frame_counters.c", "patches/frame_rate.c", "patches/settings.c",
]

# the main module's build id and the SHA-256 of exefs/main: another dump stops the lift and the build
[identity]
build_id = "e0f3ccfaf50065ae4ea01eb5aeb13b1a45da3348"
main_sha256 = "2591fb99008d0814f8056c3f36b36790048ed857ff0ae2bb3a4c1e37b960a4de"

# the prepared assets (ounce tool textures): the romfs file of the game's zstd dictionaries, and the top-level
# folders that hold no BNTX (audio; TerrainArc's TARB tiles)
[assets]
zstd_dictionaries = "Pack/ZsDic.pack.zs"
texture_skip_dirs = ["Sound", "Voice", "TerrainArc"]

# zstd_decompress_sequences' local continuations: `adr x7, <label>` ... `br x7` inside the function, pc: word; the
# code pointer audit accepts them, ounce/lift/src/plan.rs
[[local_continuations]]
pc = 0x8011060C
word = 0x10FFFCA7

[[local_continuations]]
pc = 0x80110694
word = 0x10000047
