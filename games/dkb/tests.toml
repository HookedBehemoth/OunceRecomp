# The smoke tests of `ounce test dkb [--name <test>]`: one headless run each, compared with the golden runs in the data
# folder's dkb/golden/<test>/ (`ounce test dkb --golden` records one). `set` holds the run's settings, as `ounce run --set`.

default = "tunnel"

# A new game into the mining tunnel: the run's own fresh save, the autosave notice, A at the mode select (Normal Mode),
# the intro, then Y again and again through the punching tutorial and on in the tunnel. smoke_skip: the presents left
# out before pictures are compared (the boot and the intro take a different time each run)
[tests.tunnel]
seconds = 210
smoke_skip = 9000
